<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon panier</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="cartHeader">

        <a href="index.html" class="cartLogo">
            🛍️ MA BOUTIQUE
        </a>

        <a href="index.html" class="continueShopping">
            ← Continuer mes achats
        </a>

    </header>


    <!-- CONTENU -->

    <main class="cartPage">

        <!-- =========================
             GAUCHE : PANIER
        ========================== -->

        <section class="cartProducts">

            <h1>VOTRE COMMANDE</h1>

            <div class="cartTitles">
                <span></span>
                <span>PRODUIT</span>
                <span>PRIX</span>
                <span>QUANTITÉ</span>
                <span>TOTAL</span>
                <span></span>

            </div>

            <div id="cartItems"></div>


            <div class="cartTotal">

                <span>TOTAL :</span>

                <strong id="cartTotal">
                    0 DA
                </strong>

            </div>

        </section>


        <!-- =========================
             DROITE : INFORMATIONS
        ========================== -->

        <section class="customerForm">

            <h1>FACTURATION & EXPÉDITION</h1>

            <form id="orderForm">

                <div class="formRow">

                    <div>
                        <label>Prénom *</label>

                        <input
                            type="text"
                            id="prenom"
                            required
                        >
                    </div>


                    <div>
                        <label>Nom *</label>

                        <input
                            type="text"
                            id="nom"
                            required
                        >
                    </div>

                </div>


                <div class="formRow">

                    <div>
                        <label>Wilaya *</label>

                        <select id="wilaya" required>

                            <option value="">
                                Sélectionner une wilaya
                            </option>

                            <option>01-Adrar</option>
                            <option>02-Chlef</option>
                            <option>03-Laghouat</option>
                            <option>04-Oum El Bouaghi</option>
                            <option>05-Batna</option>
                            <option>06-Béjaïa</option>
                            <option>07-Biskra</option>
                            <option>08-Béchar</option>
                            <option>09-Blida</option>
                            <option>10-Bouira</option>
                            <option>11-Tamanrasset</option>
                            <option>12-Tébessa</option>
                            <option>13-Tlemcen</option>
                            <option>13-Tiaret</option>
                            <option>13-Tizi Ouzou</option>
                            <option>16-Alger</option>
                            <option>17-Djelfa</option>
                            <option>18-Jijel</option>
                            <option>19-Sétif</option>
                            <option>20-Saïda</option>
                            <option>21-Skikda</option>
                            <option>22-Sidi Bel Abbès</option>
                            <option>23-Annaba</option>
                            <option>24-Guelma</option>
                            <option>25-Constantine</option>
                            <option>31-Oran</option>
                            <option>34-Bordj Bou Arreridj</option>
                            
                
                        </select>
                    </div>


                    <div>
                        <label>Ville *</label>

                        <input
                            type="text"
                            id="ville"
                            required
                        >
                    </div>

                </div>


                <div class="formGroup">

                    <label>Adresse *</label>

                    <textarea
                        id="adresse"
                        rows="3"
                        required
                    ></textarea>

                </div>


                <div class="formRow">

                    <div>
                        <label>Code postal</label>

                        <input
                            type="text"
                            id="codePostal"
                        >
                    </div>


                    <div>
                        <label>Téléphone *</label>

                        <input
                            type="tel"
                            id="telephone"
                            required
                        >
                    </div>

                </div>


                <div class="formGroup">

                    <label>E-mail</label>

                    <input
                        type="email"
                        id="email"
                    >

                </div>


                <div class="formGroup">

                    <label>Notes de commande</label>

                    <textarea
                        id="notes"
                        rows="4"
                        placeholder="Commentaires concernant votre commande..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="orderButton">

                    VALIDER LA COMMANDE

                </button>

            </form>

        </section>

    </main>


    <script src="carte.js"></script>

</body>

</html>
